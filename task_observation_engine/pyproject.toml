[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "task-observation-engine"
version = "0.1.0"
description = "Standalone task observation and trace collection engine"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "task_observation*",
    "mathematical_approval*",
]